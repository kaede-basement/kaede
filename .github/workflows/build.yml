name: "Build"

on:
  # All builds triggered by PRs will be debug versions and have a default 'APP_VERSION'
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - flake.lock

  push:
    # For debug builds
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - flake.lock
    branches:
      - nightly
      - beta
      - rc
      - release
    # For release builds
    tags:
      - "*"

  workflow_dispatch:

env:
  # A default value, will be overwritten later if tag exists
  APP_VERSION: "0.0.1"

jobs:
  tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS ARM"
            identifier: "macos-arm"
            platform: "macos-latest" # For Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - name: "macOS x86_64"
            identifier: "macos-x86_64"
            platform: "macos-latest" # For Intel based macs.
            args: "--target x86_64-apple-darwin"

          - name: "macOS ARM (for old Safari)"
            identifier: "macos-arm-old"
            platform: "macos-latest" # For Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin --features old-safari"
          - name: "macOS x86_64 (for old Safari)"
            identifier: "macos-x86_64-old"
            platform: "macos-latest" # For Intel based macs.
            args: "--target x86_64-apple-darwin --features old-safari"

          - name: "Linux"
            identifier: "linux"
            platform: "ubuntu-latest"
            args: ""

          - name: "Windows"
            identifier: "windows"
            platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out a repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Extract the version from the GitHub tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "APP_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Clear the GitHub ref name from invalid characters
        if: startsWith(github.ref, 'refs/tags/') != true
        shell: bash
        run: |
          CLEAR_REF_NAME="${GITHUB_REF_NAME//\//-}"
          echo "CLEAR_REF_NAME=$CLEAR_REF_NAME" >> "$GITHUB_ENV"

      - name: Bump the version in `tauri.conf.json`
        uses: restackio/update-json-file-action@2.1
        with:
          file: "./src-tauri/tauri.conf.json"
          fields: '{"version": "${{ env.APP_VERSION }}"}'

      - name: Bump the version in `Cargo.toml`
        uses: colt-1/toml-editor@1.1.1
        with:
          file: "./src-tauri/Cargo.toml"
          key: "package.version"
          value: "${{ env.APP_VERSION }}"

      # In release builds by Tauri, both 'macos-${arch}' and 'macos-${arch}-old' jobs target the same artifact spot,
      # overwriting each other, so I decided to rename the 'productName' to 'kaede-legacy', which also makes legacy
      # builds distinguishable for users, I guess. This might be a stupid idea, though
      - name: Specify the legacy keyword in `productName` of `tauri.conf.json`
        if: matrix.identifier == 'macos-arm-old' || matrix.identifier == 'macos-x86_64-old'
        uses: restackio/update-json-file-action@2.1
        with:
          file: "./src-tauri/tauri.conf.json"
          fields: '{"productName": "kaede-legacy"}'

      - name: Write the current build info to `steps.json_properties`
        id: json_properties
        uses: ActionsTools/read-json-action@v1.0.5
        with:
          file_path: "./src-tauri/tauri.conf.json"

      - name: Install frontend dependencies
        run: bun install

      - name: Run TypeScript checks
        run: bun run typecheck

      - name: Run ESLint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build a Tauri app (Non-Release)
        if: (startsWith(github.ref, 'refs/tags/')) != true
        uses: tauri-apps/tauri-action@v1
        env:
          TARGET_OLD_SAFARI: ${{ matrix.identifier == 'macos-arm-old' || matrix.identifier == 'macos-x86_64-old' }}
        with:
          args: ${{ matrix.args }}

      - name: Build a Tauri app (Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_OLD_SAFARI: ${{ matrix.identifier == 'macos-arm-old' || matrix.identifier == 'macos-x86_64-old' }}
        with:
          tagName: __VERSION__
          releaseName: "${{ steps.json_properties.outputs.productName }} v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Bundle txiki-server (Windows, non-setup)
        if: matrix.identifier == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path windows-portable-build
          Copy-Item "./src-tauri/target/release/${{ steps.json_properties.outputs.productName }}.exe" -Destination "windows-portable-build/"
          Copy-Item "./src-tauri/binaries/txiki-server-x86_64-pc-windows-msvc.exe" -Destination "windows-portable-build/txiki-server.exe"
          Set-Content -Path "windows-portable-build/portable.txt" -Value "This file is required here to enable the portable mode in Kaede."

      # Release ones
      - name: Archive the portable build for a release (Windows, non-setup)
        if: startsWith(github.ref, 'refs/tags/') && matrix.identifier == 'windows'
        shell: pwsh
        run: |
          $name = "${{ steps.json_properties.outputs.productName }}-dev-windows-non-setup-${{ steps.json_properties.outputs.version }}-${{ env.CLEAR_REF_NAME }}.zip"
          Compress-Archive -Path "windows-portable-build/*" -DestinationPath $name
          echo "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload the portable build to a release (Windows, non-setup)
        if: startsWith(github.ref, 'refs/tags/') && matrix.identifier == 'windows'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: ${{ env.ZIP_NAME }}

      # Non-release ones
      - name: Upload the portable build package (Windows, non-setup)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'windows'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-portable-windows-${{steps.json_properties.outputs.version}}-${{ env.CLEAR_REF_NAME }}"
          path: "windows-portable-build/"

      - name: Upload the binaries
        if: startsWith(github.ref, 'refs/tags/') != true
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-${{ matrix.identifier }}-${{steps.json_properties.outputs.version}}-${{ env.CLEAR_REF_NAME }}"
          # The wildcard matching handles these paths:
          #
          # - src-tauri/target/release/bundle/nsis/
          # - src-tauri/target/release/bundle/msi/
          # - src-tauri/target/release/bundle/deb/
          # - src-tauri/target/release/bundle/rpm/
          # - src-tauri/target/release/bundle/appimage/
          # - src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/
          # - src-tauri/target/x86_64-apple-darwin/release/bundle/macos/
          # - src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/
          # - src-tauri/target/aarch64-apple-darwin/release/bundle/macos/
          #
          # I should also probably note that the bundle for RPM builds is the only one
          # that uses hyphens instead of underscores in the outputted path, though the
          # final package name is unified to use only hyphens
          path: src-tauri/target/**/release/bundle/**/

  build-for-windows-7:
    name: "Windows 7 build"
    uses: kaede-basement/clanker-experiments/.github/workflows/build-for-windows-7.yml@main
    secrets: inherit
    permissions:
      contents: write
