name: "Deploy Kaede preview to Pages"

on:
  push:
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - flake.lock
    branches:
      - nightly
      - beta
      - rc
      - release

  workflow_dispatch:

env:
  APP_VERSION: "0.0.1"

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out a repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check out a repository with Browser mocks
        uses: actions/checkout@v7
        with:
          repository: "kaede-basement/clanker-experiments"
          path: "clanker-experiments"

      - name: Swap placeholder exports with actual Browser-only utils
        run: |
          rm -rf ./src/lib/browser
          mv $GITHUB_WORKSPACE/clanker-experiments/src/lib/__browser ./src/lib/browser

      - name: Build
        run: BASE_PATH=/kaede bun run build:frontend

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist folder
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
